server {
    listen 8080;

    # ライブビューアー（静的 HTML）
    root /usr/share/nginx/html;
    index index.html;

    location /hls/ {
        alias /hls/;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # ライブ配信なのでキャッシュさせない
        add_header Cache-Control no-cache always;
    }

    location /recordings/ {
        alias /recordings/;
    }

    # ステータス API は FastAPI コンテナへプロキシ
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        return 200 "ok";
    }
}
