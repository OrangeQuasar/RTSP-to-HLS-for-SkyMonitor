server {
    listen 8080;

    location /hls/ {
        alias /hls/;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # Streamlit (別ポート) のページから取得するため CORS を許可
        add_header Access-Control-Allow-Origin * always;

        # ライブ配信なのでキャッシュさせない
        add_header Cache-Control no-cache always;
    }

    location = /healthz {
        return 200 "ok";
    }
}
