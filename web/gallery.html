<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyMonitor 録画一覧</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #081426;
      color: #fafafa;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    header { padding: 12px 16px 8px; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .caption { margin: 4px 0 0; font-size: 13px; color: #9aa0a6; }
    .nav-link {
      display: inline-block;
      margin-top: 8px;
      color: #7dd3fc;
      font-size: 13px;
      text-decoration: none;
    }
    .nav-link:hover { text-decoration: underline; }

    #status {
      margin: 8px 16px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    #status.info { background: rgba(125, 211, 252, 0.15); color: #7dd3fc; }
    #status.ng { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }

    .day-group { margin-bottom: 8px; }
    .day-heading {
      margin: 20px 16px 8px;
      padding-bottom: 4px;
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      border-bottom: 1px solid #262b33;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      padding: 0 16px 8px;
    }

    .card {
      background: #171b22;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #262b33;
    }
    .card .media {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      cursor: pointer;
    }
    .card .media img,
    .card .media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .card .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: rgba(0, 0, 0, 0.2);
      pointer-events: none;
    }
    .card .meta {
      padding: 8px 10px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: #cbd5e1;
    }
    .card .meta .cam-label { font-weight: 600; color: #fafafa; }
    .card .meta .time-range { font-variant-numeric: tabular-nums; }

    #empty {
      margin: 24px 16px;
      color: #9aa0a6;
      font-size: 14px;
    }

    footer {
      padding: 6px 16px 16px;
      font-size: 12px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>
  <header>
    <h1>録画一覧</h1>
    <p class="caption">各カメラで録画された映像一覧です（新しい順）。</p>
    <a class="nav-link" href="/">← ライブ映像に戻る</a>
  </header>

  <div id="status" class="info">読み込み中…</div>

  <div id="list"></div>
  <p id="empty" hidden>まだ録画がありません。</p>

  <footer>一定期間を過ぎた録画は自動的に削除されます。</footer>

  <script>
    function toJstParts(date) {
      const parts = new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        weekday: "short",
        hour12: false,
      }).formatToParts(date);
      const get = (type) => parts.find((p) => p.type === type).value;
      return {
        year: get("year"),
        month: get("month"),
        day: get("day"),
        hour: get("hour"),
        minute: get("minute"),
        second: get("second"),
        weekday: get("weekday"),
      };
    }

    function parseStartDate(ts) {
      // ファイル名のタイムスタンプ (yyyymmddhhmmss) は録画コンテナの時刻(UTC)
      return new Date(Date.UTC(
        Number(ts.slice(0, 4)),
        Number(ts.slice(4, 6)) - 1,
        Number(ts.slice(6, 8)),
        Number(ts.slice(8, 10)),
        Number(ts.slice(10, 12)),
        Number(ts.slice(12, 14)),
      ));
    }

    function dateKey(parts) {
      return `${parts.year}-${parts.month}-${parts.day}`;
    }

    function dateLabel(parts) {
      return `${parts.year}年${parts.month}月${parts.day}日（${parts.weekday}）`;
    }

    function timeLabel(parts) {
      return `${parts.hour}:${parts.minute}:${parts.second}`;
    }

    function groupByDate(recordings) {
      const groups = new Map();
      for (const recording of recordings) {
        recording.start = parseStartDate(recording.timestamp);
        recording.end = recording.end_epoch != null
          ? new Date(recording.end_epoch * 1000)
          : recording.start;

        const key = dateKey(toJstParts(recording.start));
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(recording);
      }
      return groups;
    }

    function createCard(recording, labelMap) {
      const card = document.createElement("div");
      card.className = "card";

      const media = document.createElement("div");
      media.className = "media";
      media.addEventListener("click", () => playVideo(media, recording), { once: true });

      const badge = document.createElement("div");
      badge.className = "play-badge";
      badge.textContent = "▶";
      media.appendChild(badge);

      const start = timeLabel(toJstParts(recording.start));
      const end = timeLabel(toJstParts(recording.end));

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `
        <span class="cam-label">${labelMap[recording.camera_id] || recording.camera_id}</span>
        <span class="time-range">${start} 〜 ${end}</span>`;

      card.appendChild(media);
      card.appendChild(meta);
      return card;
    }

    function renderGroups(groups, labelMap, container) {
      for (const items of groups.values()) {
        const section = document.createElement("section");
        section.className = "day-group";

        const heading = document.createElement("h2");
        heading.className = "day-heading";
        heading.textContent = dateLabel(toJstParts(items[0].start));
        section.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "grid";
        for (const recording of items) {
          grid.appendChild(createCard(recording, labelMap));
        }
        section.appendChild(grid);

        container.appendChild(section);
      }
    }

    function playVideo(media, recording) {
      media.innerHTML = "";
      const video = document.createElement("video");
      video.src = `/recordings/${recording.camera_id}/${recording.video}`;
      video.controls = true;
      video.autoplay = true;
      media.appendChild(video);
    }

    async function init() {
      const banner = document.getElementById("status");
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");

      try {
        const [statusRes, recRes] = await Promise.all([
          fetch("/api/status"),
          fetch("/api/recordings"),
        ]);
        const { cameras } = await statusRes.json();
        const { events: recordings, total } = await recRes.json();

        const labelMap = Object.fromEntries(cameras.map((c) => [c.id, c.label]));

        if (recordings.length === 0) {
          banner.hidden = true;
          empty.hidden = false;
          return;
        }

        const groups = groupByDate(recordings);
        renderGroups(groups, labelMap, list);

        banner.className = "info";
        banner.textContent = total > recordings.length
          ? `${recordings.length}件を表示中（全${total}件中、新しい順）`
          : `${total}件の録画`;
      } catch {
        banner.className = "ng";
        banner.textContent = "録画一覧を取得できませんでした。";
      }
    }

    init();
  </script>
</body>
</html>
