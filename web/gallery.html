<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyMonitor アーカイブ</title>
  <style>
    html { color-scheme: light dark; }
    body {
      margin: 0 0.75em;
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }

    header h1 { margin: 0.3em 0 0.1em; }
    header .caption { margin: 0 0 0.2em; }

    #status {
      margin: 0.5em 0;
      padding: 0.5em 0.75em;
      border-radius: 4px;
      background: rgba(128, 128, 128, 0.15);
    }

    .day-heading {
      margin: 1em 0 0.3em;
      padding-bottom: 0.2em;
      font-size: 1.2em;
      border-bottom: 1px solid rgba(128, 128, 128, 0.4);
    }

    .hour-heading {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      font-weight: bold;
      list-style: none;
      border-radius: 4px;
    }
    .hour-heading::-webkit-details-marker { display: none; }
    .hour-heading::before {
      content: "▶";
      font-size: 0.7em;
      transition: transform 0.15s ease;
    }
    .hour-group[open] .hour-heading::before { transform: rotate(90deg); }
    .hour-heading:hover { background: rgba(128, 128, 128, 0.12); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 8px;
      padding: 4px 0 12px;
    }
    .card {
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 4px;
      overflow: hidden;
    }
    .media {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      cursor: pointer;
    }
    .media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
      background: rgba(0, 0, 0, 0.2);
      pointer-events: none;
    }
    .meta {
      padding: 6px 8px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cam-label { font-weight: bold; }
    .time-range { font-variant-numeric: tabular-nums; }

    #empty { margin: 1em 0; }

    footer { padding-bottom: 0.75em; }
  </style>
</head>
<body>
  <header>
    <h1>アーカイブ</h1>
    <p class="caption">各カメラで録画された映像一覧です（新しい順）。各映像は定期的に保存されます。最新の映像のアーカイブには少し時間がかかる場合があります。</p>
    <a href="/">ライブ映像に戻る</a>
  </header>

  <div id="status">読み込み中…</div>

  <div id="list"></div>
  <p id="empty" hidden>まだ録画がありません。</p>

  <footer>一定期間を過ぎた録画は自動的に削除されます。</footer>

  <script>
    // ===== 設定値 =====
    // 時刻を日本時間の年・月・日・時・分・秒・曜日に分けるための書式
    const JST_FORMAT = new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      weekday: "short",
      hour12: false,
    });

    // 要素を作るヘルパー: el("div", { className: "x" }, 子要素や文字列...)
    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    // ===== 起動 =====
    async function init() {
      const banner = document.getElementById("status");
      try {
        const [statusRes, recRes] = await Promise.all([
          fetch("/api/status"),
          fetch("/api/recordings"),
        ]);
        const { cameras } = await statusRes.json();
        const { events: recordings } = await recRes.json();

        if (recordings.length === 0) {
          document.getElementById("empty").hidden = false;
        } else {
          const labelMap = Object.fromEntries(cameras.map((c) => [c.id, c.label]));
          renderRecordings(recordings, labelMap, document.getElementById("list"));
        }
      } finally {
        // 取得に失敗したときも「読み込み中…」は消す（エラーの内容はブラウザのコンソールに出る）
        banner.hidden = true;
      }
    }

    // ===== 時刻の扱い =====
    function parseStartDate(ts) {
      // ファイル名のタイムスタンプ (yyyymmddhhmmss) は録画コンテナの時刻(UTC)
      return new Date(Date.UTC(
        Number(ts.slice(0, 4)),
        Number(ts.slice(4, 6)) - 1,
        Number(ts.slice(6, 8)),
        Number(ts.slice(8, 10)),
        Number(ts.slice(10, 12)),
        Number(ts.slice(12, 14)),
      ));
    }

    // { year, month, day, hour, minute, second, weekday } の形で返す
    function toJstParts(date) {
      return Object.fromEntries(JST_FORMAT.formatToParts(date).map((p) => [p.type, p.value]));
    }

    function dateLabel(parts) {
      return `${parts.year}年${parts.month}月${parts.day}日（${parts.weekday}）`;
    }

    function timeLabel(parts) {
      return `${parts.hour}:${parts.minute}:${parts.second}`;
    }

    // ===== 一覧の表示 =====
    // keyOf が同じ値を返すものを、出てきた順のまま Map にまとめる
    function groupBy(items, keyOf) {
      const groups = new Map();
      for (const item of items) {
        const key = keyOf(item);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      return groups;
    }

    // 日付ごと → 時間帯ごとにまとめて表示する（日本時間で区切る）
    function renderRecordings(recordings, labelMap, container) {
      for (const recording of recordings) {
        recording.start = parseStartDate(recording.timestamp);
        recording.end = recording.end_epoch != null
          ? new Date(recording.end_epoch * 1000)
          : recording.start;
        recording.startParts = toJstParts(recording.start);
      }

      const days = groupBy(recordings, (r) => `${r.startParts.year}-${r.startParts.month}-${r.startParts.day}`);
      let isFirstHourGroup = true;
      for (const dayItems of days.values()) {
        const section = el("section", {},
          el("h2", { className: "day-heading", textContent: dateLabel(dayItems[0].startParts) }),
        );

        for (const hourItems of groupBy(dayItems, (r) => r.startParts.hour).values()) {
          const details = el("details", { className: "hour-group" },
            el("summary", { className: "hour-heading", textContent: `${hourItems[0].startParts.hour}時台` }),
            el("div", { className: "grid" }, ...hourItems.map((r) => createCard(r, labelMap))),
          );
          // 直近の時間帯だけ最初から開いておく
          details.open = isFirstHourGroup;
          isFirstHourGroup = false;
          section.append(details);
        }

        container.append(section);
      }
    }

    function createCard(recording, labelMap) {
      const media = el("div", { className: "media" },
        el("div", { className: "play-badge", textContent: "▶" }),
      );
      media.addEventListener("click", () => playVideo(media, recording), { once: true });

      const start = timeLabel(recording.startParts);
      const end = timeLabel(toJstParts(recording.end));
      return el("div", { className: "card" },
        media,
        el("div", { className: "meta" },
          el("span", { className: "cam-label", textContent: labelMap[recording.camera_id] || recording.camera_id }),
          el("span", { className: "time-range", textContent: `${start} 〜 ${end}` }),
        ),
      );
    }

    // ===== 映像の再生 =====
    // 「▶」の表示を、その録画の映像に置き換えて再生する
    function playVideo(media, recording) {
      media.replaceChildren(el("video", {
        src: `/recordings/${recording.camera_id}/${recording.video}`,
        controls: true,
        autoplay: true,
      }));
    }

    init();
  </script>
</body>
</html>
