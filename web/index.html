<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyMonitor Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    html { color-scheme: light dark; }
    html, body { height: 100%; }
    body {
      margin: 0 0 0 0.75em;
      display: flex;
      flex-direction: column;
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }

    header h1 { margin: 0.3em 0 0.1em; }
    header .caption { margin: 0 0 0.2em; }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 0 8px;
    }
    main.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    main.count-2 { grid-template-rows: 1fr; }
    .cell {
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 0;
      container-type: size;
    }
    .cell:nth-child(odd) { justify-content: flex-end; }
    .cell:nth-child(even) { justify-content: flex-start; }
    main.count-1 .cell { justify-content: center; }

    .panel {
      position: relative;
      background: #000;
      overflow: hidden;
      --ar: 1.7778;
      aspect-ratio: var(--ar);
      width: min(100cqw, 100cqh * var(--ar));
    }
    .panel video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .badge {
      position: absolute;
      top: 6px;
      left: 8px;
      padding: 2px 8px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 13px;
      border-radius: 4px;
    }

    .save-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      padding: 4px 10px;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .save-btn:hover { background: rgba(0, 0, 0, 0.7); }
    .save-btn:disabled { cursor: default; opacity: 0.7; }

    .panel.message {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1a2e;
      color: #6b7280;
      font-size: 14px;
    }
    .no-camera {
      margin: auto;
      color: #9aa0a6;
      font-size: 14px;
    }

    footer { padding-bottom: 0.75em; }
  </style>
</head>
<body>
  <header>
    <h1>山形大学小白川キャンパス 屋上スカイモニター映像</h1>
    <p class="caption"><a href="https://twos.sola.or.jp/" target="_blank" rel="noopener">TWOS</a>の一部メンバーが、火球を捉えられればいいなと思って作成・運用しています。</p>
    <a href="/gallery.html">アーカイブ</a>
  </header>

  <main id="grid"></main>

  <footer>若干の遅延が発生する場合があります。</footer>

  <script>
    // ===== 設定値 =====
    // カメラ構成を取得できなかったときに、ページを読み直すまでの時間
    const RELOAD_DELAY_MS = 10000;
    // hls.js の致命的なエラーから復旧を試みるまでの時間
    const NETWORK_RETRY_DELAY_MS = 1000;
    const PLAYER_RECREATE_DELAY_MS = 3000;
    // 保存ボタンの文字と、保存結果を表示しておく時間
    const SAVE_LABEL = "今すぐ保存";
    const SAVE_RESULT_DISPLAY_MS = 2500;

    const grid = document.getElementById("grid");

    // 要素を作るヘルパー: el("div", { className: "x" }, 子要素や文字列...)
    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    // ===== 起動 =====
    async function init() {
      // パネルの構成（カメラ ID・表示名・有効かどうか）はページを開いたときに一度だけ取得する
      let config;
      try {
        config = await fetchCameraConfig();
      } catch {
        setTimeout(() => location.reload(), RELOAD_DELAY_MS);
        return;
      }

      const { cameras, hideDisabled } = config;
      if (!cameras.some((c) => c.enabled)) {
        grid.className = "count-1";
        grid.append(el("p", { className: "no-camera", textContent: "有効なカメラがありません。" }));
        return;
      }

      // 未設定のカメラを外して詰めるか、「未設定」パネルとして元の位置に残すか（HIDE_DISABLED_CAMERAS）
      const shown = hideDisabled ? cameras.filter((c) => c.enabled) : cameras;
      grid.className = `count-${shown.length}`;
      for (const cam of shown) {
        if (cam.enabled) {
          addCameraPanel(cam);
        } else {
          addMessagePanel(`${cam.label}（未設定）`);
        }
      }
    }

    async function fetchCameraConfig() {
      const res = await fetch("/api/status");
      if (!res.ok) throw new Error("status failed");
      const { cameras, hide_disabled } = await res.json();
      return { cameras, hideDisabled: hide_disabled };
    }

    // ===== パネルの作成 =====
    function addCell(panel) {
      grid.append(el("div", { className: "cell" }, panel));
    }

    // 映像の代わりに文字だけを出すパネル
    function addMessagePanel(text) {
      addCell(el("div", { className: "panel message" }, text));
    }

    function addCameraPanel(cam) {
      // 自動再生にはミュートが必要（defaultMuted で muted 属性も付ける）
      const video = el("video", { defaultMuted: true, muted: true, autoplay: true, playsInline: true });
      const saveBtn = el("button", { className: "save-btn", textContent: SAVE_LABEL });
      saveBtn.addEventListener("click", () => saveClip(cam.id, saveBtn));

      const panel = el("div", { className: "panel" },
        video,
        el("div", { className: "badge", textContent: cam.label }),
        saveBtn,
      );
      addCell(panel);
      startPlayer(cam.id, video, panel);
    }

    // ===== 映像の再生 =====
    function startPlayer(camId, video, panel) {
      const src = `/hls/${camId}/stream.m3u8`;

      // パネルを映像の実アスペクト比に合わせ、黒帯（レターボックス）をなくす
      video.addEventListener("loadedmetadata", () => {
        if (video.videoWidth && video.videoHeight) {
          panel.style.setProperty("--ar", video.videoWidth / video.videoHeight);
        }
      });

      if (Hls.isSupported()) {
        createHlsPlayer(src, video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari はネイティブ HLS 再生
        video.src = src;
      }
    }

    function createHlsPlayer(src, video) {
      const hls = new Hls({
        liveSyncDurationCount: 3,
        maxLiveSyncPlaybackRate: 1.5,
      });
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        // hls.js 推奨のエラー種別ごとの復旧処理
        // https://github.com/video-dev/hls.js/blob/master/docs/API.md#fatal-error-recovery
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            setTimeout(() => hls.startLoad(), NETWORK_RETRY_DELAY_MS);
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            // 復旧不能なエラーはプレイヤーごと作り直す
            hls.destroy();
            setTimeout(() => createHlsPlayer(src, video), PLAYER_RECREATE_DELAY_MS);
        }
      });
    }

    // ===== 映像の保存 =====
    async function saveClip(camId, btn) {
      btn.disabled = true;
      btn.textContent = "保存中…";
      try {
        const res = await fetch(`/api/recordings/save?camera_id=${camId}`, { method: "POST" });
        if (!res.ok) throw new Error("save failed");
        downloadBlob(await res.blob(), filenameFromResponse(res, `${camId}.mp4`));
        btn.textContent = "保存しました";
      } catch {
        btn.textContent = "保存に失敗しました";
      } finally {
        setTimeout(() => {
          btn.textContent = SAVE_LABEL;
          btn.disabled = false;
        }, SAVE_RESULT_DISPLAY_MS);
      }
    }

    // サーバーが Content-Disposition で付けたファイル名を取り出す（なければ fallback）
    function filenameFromResponse(res, fallback) {
      const header = res.headers.get("Content-Disposition") || "";
      const match = header.match(/filename="?([^";]+)"?/);
      return match ? match[1] : fallback;
    }

    // 受け取ったデータをファイルとしてダウンロードさせる
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      el("a", { href: url, download: filename }).click();
      URL.revokeObjectURL(url);
    }

    init();
  </script>
</body>
</html>
