<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyMonitor Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    html { color-scheme: light dark; }
    html, body { height: 100%; }
    body {
      margin: 0 0 0 0.75em;
      display: flex;
      flex-direction: column;
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }

    header h1 { margin: 0.3em 0 0.1em; }
    header .caption { margin: 0 0 0.2em; }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 0 8px;
    }
    main.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    main.count-2 { grid-template-rows: 1fr; }
    .cell {
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 0;
      container-type: size;
    }
    .cell:nth-child(odd) { justify-content: flex-end; }
    .cell:nth-child(even) { justify-content: flex-start; }
    main.count-1 .cell { justify-content: center; }

    .panel {
      position: relative;
      background: #000;
      overflow: hidden;
      --ar: 1.7778;
      aspect-ratio: var(--ar);
      width: min(100cqw, 100cqh * var(--ar));
    }
    .panel video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .badge {
      position: absolute;
      top: 6px;
      left: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 13px;
      border-radius: 4px;
    }
    /* 接続状態の印: 接続中は緑、切断は赤、未設定はグレー */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
    }
    .panel[data-state="live"] .dot { background: #22c55e; }
    .panel[data-state="down"] .dot { background: #ef4444; }

    .panel-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      padding: 4px 10px;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .panel-btn:hover { background: rgba(0, 0, 0, 0.7); }
    .panel-btn:disabled { cursor: default; opacity: 0.7; }
    /* 保存ボタンは接続中だけ、再接続ボタンは切断中だけ出す */
    .panel:not([data-state="live"]) .save-btn,
    .panel:not([data-state="down"]) .reconnect-btn { display: none; }
    .no-camera {
      margin: auto;
      color: #9aa0a6;
      font-size: 14px;
    }

    footer { padding-bottom: 0.75em; }
  </style>
</head>
<body>
  <header>
    <h1>山形大学小白川キャンパス 屋上スカイモニター映像</h1>
    <p class="caption"><a href="https://twos.sola.or.jp/" target="_blank" rel="noopener">TWOS</a>の一部メンバーが、火球を捉えられればいいなと思って作成・運用しています。</p>
    <a href="/gallery.html">アーカイブ</a>
  </header>

  <main id="grid"></main>

  <footer>若干の遅延が発生する場合があります。</footer>

  <script>
    // ===== 設定値 =====
    // カメラ構成を取得できなかったときに、ページを読み直すまでの時間
    const RELOAD_DELAY_MS = 10000;
    // 接続状態（緑・赤・グレーの印）を確認し直す間隔
    const STATUS_POLL_MS = 10000;
    // hls.js の致命的なエラーから復旧を試みるまでの時間
    const NETWORK_RETRY_DELAY_MS = 1000;
    const PLAYER_RECREATE_DELAY_MS = 3000;
    // 保存ボタンの文字と、保存結果を表示しておく時間
    const SAVE_LABEL = "今すぐ保存";
    const SAVE_RESULT_DISPLAY_MS = 2500;
    // 再接続ボタンの文字と、押してから再び押せるようになるまでの時間
    const RECONNECT_LABEL = "再接続";
    const RECONNECT_WAIT_MS = 30000;

    const grid = document.getElementById("grid");
    // カメラ ID → { panel, player }（表示中のパネルだけ）
    const panels = new Map();

    // 要素を作るヘルパー: el("div", { className: "x" }, 子要素や文字列...)
    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    // ===== 起動 =====
    async function init() {
      // パネルの構成（カメラ ID・表示名・有効かどうか）はページを開いたときに一度だけ取得する
      let config;
      try {
        config = await fetchCameraConfig();
      } catch {
        setTimeout(() => location.reload(), RELOAD_DELAY_MS);
        return;
      }

      const { cameras, hideDisabled } = config;
      if (!cameras.some((c) => c.enabled)) {
        grid.className = "count-1";
        grid.append(el("p", { className: "no-camera", textContent: "有効なカメラがありません。" }));
        return;
      }

      // 未設定のカメラを外して詰めるか、グレーの印のパネルとして元の位置に残すか（HIDE_DISABLED_CAMERAS）
      const shown = hideDisabled ? cameras.filter((c) => c.enabled) : cameras;
      grid.className = `count-${shown.length}`;
      for (const cam of shown) {
        addCameraPanel(cam);
      }
      applyStatus(cameras);
      setInterval(refreshStatus, STATUS_POLL_MS);
    }

    async function fetchCameraConfig() {
      const res = await fetch("/api/status");
      if (!res.ok) throw new Error("status failed");
      const { cameras, hide_disabled } = await res.json();
      return { cameras, hideDisabled: hide_disabled };
    }

    // ===== 接続状態 =====
    async function refreshStatus() {
      try {
        applyStatus((await fetchCameraConfig()).cameras);
      } catch {
        // 取得に失敗したときは印を変えずに次の確認を待つ
      }
    }

    // live: 接続中（緑）、down: 切断（赤）、off: 未設定（グレー）
    function applyStatus(cameras) {
      for (const cam of cameras) {
        const entry = panels.get(cam.id);
        if (!entry) continue;
        const state = !cam.enabled ? "off" : cam.live ? "live" : "down";
        const prev = entry.panel.dataset.state;
        entry.panel.dataset.state = state;
        // 切断から戻ったときは、配信が作り直されているのでプレイヤーも読み込み直す
        if (state === "live" && prev && prev !== "live") entry.player?.restart();
      }
    }

    // ===== パネルの作成 =====
    function addCameraPanel(cam) {
      const panel = el("div", { className: "panel" },
        el("div", { className: "badge" }, el("span", { className: "dot" }), cam.label),
      );
      grid.append(el("div", { className: "cell" }, panel));

      // 未設定のカメラは黒いパネルにカメラ名とグレーの印だけを出す
      if (!cam.enabled) {
        panels.set(cam.id, { panel, player: null });
        return;
      }

      // 自動再生にはミュートが必要（defaultMuted で muted 属性も付ける）
      const video = el("video", { defaultMuted: true, muted: true, autoplay: true, playsInline: true });
      const saveBtn = el("button", { className: "panel-btn save-btn", textContent: SAVE_LABEL });
      saveBtn.addEventListener("click", () => saveClip(cam.id, saveBtn));
      const reconnectBtn = el("button", { className: "panel-btn reconnect-btn", textContent: RECONNECT_LABEL });
      reconnectBtn.addEventListener("click", () => requestReconnect(cam.id, reconnectBtn));

      panel.prepend(video);
      panel.append(saveBtn, reconnectBtn);
      panels.set(cam.id, { panel, player: startPlayer(cam.id, video, panel) });
    }

    // ===== 映像の再生 =====
    // 再生を始め、読み込み直すための restart() を返す
    function startPlayer(camId, video, panel) {
      const src = `/hls/${camId}/stream.m3u8`;

      // パネルを映像の実アスペクト比に合わせ、黒帯（レターボックス）をなくす
      video.addEventListener("loadedmetadata", () => {
        if (video.videoWidth && video.videoHeight) {
          panel.style.setProperty("--ar", video.videoWidth / video.videoHeight);
        }
      });

      let hls = null;
      function start() {
        if (Hls.isSupported()) {
          hls?.destroy();
          hls = createHlsPlayer(src, video, start);
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // Safari はネイティブ HLS 再生
          video.src = src;
        }
      }
      start();
      return { restart: start };
    }

    // recreate: 復旧できないエラーのときにプレイヤーを作り直す関数
    function createHlsPlayer(src, video, recreate) {
      const hls = new Hls({
        liveSyncDurationCount: 3,
        maxLiveSyncPlaybackRate: 1.5,
      });
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        // hls.js 推奨のエラー種別ごとの復旧処理
        // https://github.com/video-dev/hls.js/blob/master/docs/API.md#fatal-error-recovery
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            setTimeout(() => hls.startLoad(), NETWORK_RETRY_DELAY_MS);
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            setTimeout(recreate, PLAYER_RECREATE_DELAY_MS);
        }
      });
      return hls;
    }

    // ===== 再接続 =====
    // サーバーにカメラへの接続のやり直しを頼む（実際につながると、次の状態確認で緑に戻る）
    async function requestReconnect(camId, btn) {
      btn.disabled = true;
      let waitMs = RECONNECT_WAIT_MS;
      try {
        const res = await fetch(`/api/cameras/${camId}/reconnect`, { method: "POST" });
        if (!res.ok) throw new Error("reconnect failed");
        btn.textContent = "再接続中…";
      } catch {
        btn.textContent = "再接続に失敗しました";
        waitMs = SAVE_RESULT_DISPLAY_MS;
      }
      setTimeout(() => {
        btn.textContent = RECONNECT_LABEL;
        btn.disabled = false;
      }, waitMs);
    }

    // ===== 映像の保存 =====
    async function saveClip(camId, btn) {
      btn.disabled = true;
      btn.textContent = "保存中…";
      try {
        const res = await fetch(`/api/recordings/save?camera_id=${camId}`, { method: "POST" });
        if (!res.ok) throw new Error("save failed");
        downloadBlob(await res.blob(), filenameFromResponse(res, `${camId}.mp4`));
        btn.textContent = "保存しました";
      } catch {
        btn.textContent = "保存に失敗しました";
      } finally {
        setTimeout(() => {
          btn.textContent = SAVE_LABEL;
          btn.disabled = false;
        }, SAVE_RESULT_DISPLAY_MS);
      }
    }

    // サーバーが Content-Disposition で付けたファイル名を取り出す（なければ fallback）
    function filenameFromResponse(res, fallback) {
      const header = res.headers.get("Content-Disposition") || "";
      const match = header.match(/filename="?([^";]+)"?/);
      return match ? match[1] : fallback;
    }

    // 受け取ったデータをファイルとしてダウンロードさせる
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      el("a", { href: url, download: filename }).click();
      URL.revokeObjectURL(url);
    }

    init();
  </script>
</body>
</html>
