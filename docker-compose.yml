services:
  streamer1:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_1:?RTSP_URL_1 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_1:-copy}
      CAMERA_NAME: cam1
    volumes:
      - hls:/hls

  streamer2:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_2:?RTSP_URL_2 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_2:-copy}
      CAMERA_NAME: cam2
    volumes:
      - hls:/hls

  streamer3:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_3:?RTSP_URL_3 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_3:-copy}
      CAMERA_NAME: cam3
    volumes:
      - hls:/hls

  streamer4:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_4:?RTSP_URL_4 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_4:-copy}
      CAMERA_NAME: cam4
    volumes:
      - hls:/hls

  # 火球・流星の自動検出
  # https://github.com/kin-hasegawa/meteor-detect
  detector1:
    build: ./detector
    restart: unless-stopped
    command:
      - -u
      - ${RTSP_URL_1:?RTSP_URL_1 を .env に設定してください}
      - -n
      - -o
      - /recordings/cam1
    volumes:
      - recordings:/recordings
    depends_on:
      - streamer1

  detector2:
    build: ./detector
    restart: unless-stopped
    command:
      - -u
      - ${RTSP_URL_2:?RTSP_URL_2 を .env に設定してください}
      - -n
      - -o
      - /recordings/cam2
    volumes:
      - recordings:/recordings
    depends_on:
      - streamer2

  detector3:
    build: ./detector
    restart: unless-stopped
    command:
      - -u
      - ${RTSP_URL_3:?RTSP_URL_3 を .env に設定してください}
      - -n
      - -o
      - /recordings/cam3
    volumes:
      - recordings:/recordings
    depends_on:
      - streamer3

  detector4:
    build: ./detector
    restart: unless-stopped
    command:
      - -u
      - ${RTSP_URL_4:?RTSP_URL_4 を .env に設定してください}
      - -n
      - -o
      - /recordings/cam4
    volumes:
      - recordings:/recordings
    depends_on:
      - streamer4

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - hls:/hls:ro
      - recordings:/recordings:ro
    depends_on:
      - streamer1
      - streamer2
      - streamer3
      - streamer4
      - detector1
      - detector2
      - detector3
      - detector4
      - api

  api:
    build: .
    restart: unless-stopped
    environment:
      CAMERA_1_LABEL: ${CAMERA_1_LABEL:-カメラ1}
      CAMERA_2_LABEL: ${CAMERA_2_LABEL:-カメラ2}
      CAMERA_3_LABEL: ${CAMERA_3_LABEL:-カメラ3}
      CAMERA_4_LABEL: ${CAMERA_4_LABEL:-カメラ4}
    volumes:
      - hls:/hls:ro
      - recordings:/recordings:ro

volumes:
  hls:
  recordings:
