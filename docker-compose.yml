services:
  streamer1:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_1:?RTSP_URL_1 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_1:-copy}
      CAMERA_NAME: cam1
      RECORDING_SEGMENT_SECONDS: ${RECORDING_SEGMENT_SECONDS:-600}
      SAVE_CLIP_SECONDS: ${SAVE_CLIP_SECONDS:-30}
    volumes:
      - hls:/hls
      - recordings:/recordings

  streamer2:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_2:?RTSP_URL_2 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_2:-copy}
      CAMERA_NAME: cam2
      RECORDING_SEGMENT_SECONDS: ${RECORDING_SEGMENT_SECONDS:-600}
      SAVE_CLIP_SECONDS: ${SAVE_CLIP_SECONDS:-30}
    volumes:
      - hls:/hls
      - recordings:/recordings

  streamer3:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_3:?RTSP_URL_3 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_3:-copy}
      CAMERA_NAME: cam3
      RECORDING_SEGMENT_SECONDS: ${RECORDING_SEGMENT_SECONDS:-600}
      SAVE_CLIP_SECONDS: ${SAVE_CLIP_SECONDS:-30}
    volumes:
      - hls:/hls
      - recordings:/recordings

  streamer4:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_4:?RTSP_URL_4 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_4:-copy}
      CAMERA_NAME: cam4
      RECORDING_SEGMENT_SECONDS: ${RECORDING_SEGMENT_SECONDS:-600}
      SAVE_CLIP_SECONDS: ${SAVE_CLIP_SECONDS:-30}
    volumes:
      - hls:/hls
      - recordings:/recordings

  # 保持期間を過ぎた録画ファイルを定期的に削除する
  cleanup:
    build: ./cleanup
    restart: unless-stopped
    environment:
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-3}
    volumes:
      - recordings:/recordings

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - hls:/hls:ro
      - recordings:/recordings:ro
    depends_on:
      - streamer1
      - streamer2
      - streamer3
      - streamer4
      - api

  api:
    build: .
    restart: unless-stopped
    environment:
      CAMERA_1_LABEL: ${CAMERA_1_LABEL:-カメラ1}
      CAMERA_2_LABEL: ${CAMERA_2_LABEL:-カメラ2}
      CAMERA_3_LABEL: ${CAMERA_3_LABEL:-カメラ3}
      CAMERA_4_LABEL: ${CAMERA_4_LABEL:-カメラ4}
      SAVE_CLIP_SECONDS: ${SAVE_CLIP_SECONDS:-30}
    volumes:
      - hls:/hls:ro
      - recordings:/recordings:ro

volumes:
  hls:
  recordings:
