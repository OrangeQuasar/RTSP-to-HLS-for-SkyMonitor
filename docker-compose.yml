services:
  streamer1:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_1:?RTSP_URL_1 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_1:-copy}
      CAMERA_NAME: cam1
    volumes:
      - hls:/hls

  streamer2:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_2:?RTSP_URL_2 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_2:-copy}
      CAMERA_NAME: cam2
    volumes:
      - hls:/hls

  streamer3:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_3:?RTSP_URL_3 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_3:-copy}
      CAMERA_NAME: cam3
    volumes:
      - hls:/hls

  streamer4:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL_4:?RTSP_URL_4 を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC_4:-copy}
      CAMERA_NAME: cam4
    volumes:
      - hls:/hls

  hls-server:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HLS_PORT:-8888}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - hls:/hls:ro
    depends_on:
      - streamer1
      - streamer2
      - streamer3
      - streamer4

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      HLS_PORT: ${HLS_PORT:-8888}
      CAMERA_1_LABEL: ${CAMERA_1_LABEL:-カメラ1}
      CAMERA_2_LABEL: ${CAMERA_2_LABEL:-カメラ2}
      CAMERA_3_LABEL: ${CAMERA_3_LABEL:-カメラ3}
      CAMERA_4_LABEL: ${CAMERA_4_LABEL:-カメラ4}
    volumes:
      - hls:/hls:ro
    depends_on:
      - hls-server

volumes:
  hls:
