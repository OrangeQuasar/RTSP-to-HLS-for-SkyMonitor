services:
  streamer:
    build: ./streamer
    restart: unless-stopped
    environment:
      RTSP_URL: ${RTSP_URL:?RTSP_URL を .env に設定してください}
      VIDEO_CODEC: ${VIDEO_CODEC:-copy}
    volumes:
      - hls:/hls

  hls-server:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HLS_PORT:-8888}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - hls:/hls:ro
    depends_on:
      - streamer

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      HLS_PORT: ${HLS_PORT:-8888}
    volumes:
      - hls:/hls:ro
    depends_on:
      - hls-server

volumes:
  hls:
