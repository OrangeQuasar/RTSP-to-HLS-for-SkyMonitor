services:
  skymonitor:
    build: .
    container_name: skymonitor
    ports:
      - "8501:8501"
    environment:
      # .env ファイルで設定する(README 参照)
      RTSP_URL: ${RTSP_URL:?RTSP_URL を .env に設定してください}
      RTSP_TRANSPORT: ${RTSP_TRANSPORT:-tcp}
      VIDEO_CODEC: ${VIDEO_CODEC:-copy}
    restart: unless-stopped
